<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  The privacy promise, made structural rather than claimed. connect-src 'none'
  means this app cannot phone home even by accident: no fetch, no XHR, no
  WebSocket, no beacon. script-src 'self' means nothing runs that did not ship
  in this folder. Inline styles are permitted because the grid sets a per-cell
  fill level through a style attribute; CSS cannot exfiltrate anything with
  img-src pinned to self.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Habit Grid</title>
<meta name="description" content="A local-first habit tracker. Nothing but the grid.">
<meta name="theme-color" content="#131210">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="stylesheet" href="./styles.css">

<!--
  The shared appearance layer, identical in every app on this origin. It is a
  plain script rather than a module so it runs before the module graph and
  before first paint, which is what keeps the wrong theme from flashing. It
  touches localStorage only; connect-src 'none' above still holds, so the
  privacy promise is unchanged.
-->
<script src="./js/theme.js"></script>
<script src="./js/theme-boot.js"></script>
</head>
